<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RhinoSecure &mdash; Plan Viewer</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#128058;</span>
        <span class="brand-name">RhinoSecure</span>
        <span class="brand-sub">read-only plan viewer</span>
      </div>
      <div id="run-meta" class="run-meta"></div>
      <button id="chat-toggle-btn" class="chat-toggle-btn" type="button" hidden>Chat</button>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h2 class="sidebar-title">Pipeline</h2>
        <ol id="pipeline-stages" class="stage-list"></ol>
      </aside>

      <main class="main">
        <nav class="tabs" id="tabs">
          <button class="tab-btn active" data-tab="overview" type="button">Overview</button>
          <button class="tab-btn" data-tab="findings" type="button">Findings</button>
          <button class="tab-btn" data-tab="contested" type="button">Contested</button>
          <button class="tab-btn" data-tab="constraints" type="button">Constraints</button>
        </nav>

        <section id="tab-overview" class="tab-panel active"></section>
        <section id="tab-findings" class="tab-panel"></section>
        <section id="tab-contested" class="tab-panel"></section>
        <section id="tab-constraints" class="tab-panel"></section>
      </main>

      <aside id="chat-panel" class="chat-panel" hidden>
        <div class="chat-panel-head">
          <h2>Chat — this plan only</h2>
          <button id="chat-close-btn" class="chat-close-btn" type="button" aria-label="Close chat">&times;</button>
        </div>
        <p class="chat-panel-hint">
          Answers are grounded in this export only — no CVE knowledge, no live lookups. Every
          citation shows the finding's real score and bucket, taken from the export, never from
          the model.
        </p>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" rows="2" placeholder="Ask about this plan..."></textarea>
          <button id="chat-send-btn" type="submit">Send</button>
        </form>
      </aside>
    </div>
  </div>

  <div id="error-banner" class="error-banner" hidden></div>
  <div id="job-status" class="job-status" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
