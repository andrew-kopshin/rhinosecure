[project]
name = "rhinosecure"
version = "0.1.0"
description = "Business-context-aware vulnerability remediation planning agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
agents = [
    "crewai",
    "langchain",
    "langchain-anthropic",
    "requests",
    "chromadb",
]
dev = [
    "pytest",
]

[project.scripts]
rhino = "rhinosecure.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
