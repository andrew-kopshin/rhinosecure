[project]
name = "rhinosecure"
version = "0.1.0"
description = "Business-context-aware vulnerability remediation planning agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
agents = [
    "anthropic",
    "crewai",
    "langchain",
    "langchain-anthropic",
    "chromadb",
]
web = [
    "fastapi",
    "uvicorn",
    "python-multipart",
]
# Its own extra, not folded into core `dependencies`: only `rhino xlsx-to-
# csv` needs it, and every other command (including the deterministic
# scoring path) must keep working on an install that never brought it in.
# `dev` depends on this extra (via the self-reference below) rather than
# duplicating the pin, since the existing ZIP-signature-refusal tests
# already construct real .xlsx binaries with it (tests/test_ingest_csv_
# source.py and others) -- one `pip install -e ".[dev]"` still gets
# everything the full test suite needs.
xlsx = [
    "openpyxl~=3.1.5",
]
dev = [
    "pytest",
    "rhinosecure[xlsx]",
]

[project.scripts]
rhino = "rhinosecure.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rhinosecure.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
